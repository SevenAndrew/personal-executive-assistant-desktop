[project]
name = "personal-executive-assistant-app"
version = "0.16.2"
description = "Standalone local Personal Executive Assistant application"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SevenAndrew" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.6,<26",
    "mcp>=1.12,<2",
    "openai>=2.17,<3",
    "pydantic>=2.11,<3",
    "pyside6>=6.9,<7",
]

[project.scripts]
pea-app = "pea_app.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pea_app"]

[tool.hatch.build.targets.wheel.force-include]
"pea_app/assets/pea-logo.png" = "pea_app/assets/pea-logo.png"
"pea_app/assets/PEA.icns" = "pea_app/assets/PEA.icns"
"pea_app/assets/checkmark.svg" = "pea_app/assets/checkmark.svg"
"pea_app/assets/help/guidance-overview.png" = "pea_app/assets/help/guidance-overview.png"
"pea_app/installer_assets/omnifocus/server.py" = "pea_app/installer_assets/omnifocus/server.py"
"pea_app/installer_assets/omnifocus/bridge.py" = "pea_app/installer_assets/omnifocus/bridge.py"

[dependency-groups]
build = [
    "pyinstaller==6.22.0",
]
test = [
    "pytest>=9.0.3,<10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
